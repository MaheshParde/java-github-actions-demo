name: Java Docker Build & Push

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Run tests and capture logs
        run: |
          mvn test | tee test.log || true

      # -------- AI ANALYSIS (QUALITY GATE) --------

      - name: Create AI analyzer script
        run: |
          cat <<EOF > ai_analyze.py
          import sys
          from transformers import pipeline

          log_file = sys.argv[1]
          logs = open(log_file).read()[:512]

          classifier = pipeline(
              "text-classification",
              model="distilbert-base-uncased"
          )

          result = classifier(logs)
          print("AI ANALYSIS RESULT:")
          print(result)
          EOF
          
      - name: Create AI Dockerfile
        run: |
          cat <<EOF > Dockerfile.ai
          FROM python:3.10-slim
          RUN pip install transformers torch --no-cache-dir
          COPY ai_analyze.py /app/ai_analyze.py
          WORKDIR /app
          ENTRYPOINT ["python", "ai_analyze.py"]
          EOF

      - name: Build & run AI container
        run: |
          docker build -f Dockerfile.ai -t ai-analyzer .
          docker run --rm -v "$PWD:/data" ai-analyzer /data/test.log

      - name: Remove AI artifacts
        run: |
          rm -f ai_analyze.py Dockerfile.ai test.log
          docker rmi ai-analyzer || true

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest          

     
