name: Java Docker Build & Push

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Run tests and capture logs
        run: |
          mvn test | tee test.log || true

      # -------- AI ANALYSIS (QUALITY GATE) --------
      - name: Build AI image
        run: |
          docker build -f ai/Dockerfile.ai -t ai-analyzer ai/
      
      - name: Run AI source analysis
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            ai-analyzer      

      - name: Remove AI artifacts
        run: |
          rm -f ai_analyze.py Dockerfile.ai test.log
          docker rmi ai-analyzer || true

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest          

     
