name: Java Docker Build & Push

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest

      - name: Generate test logs
        run: mvn test | tee test.logs || true

      - name: Create AI Dockerfile at runtime
        run: |
          cat <<EOF > Dockerfile.ai
          FROM python:3.10-slim
          RUN pip install transformers torch --no-cache-dir
          COPY ai_analyze.py /app/ai_analyze.py
          WORKDIR /app
          ENTRYPOINT ["python", "ai_analyze.py"]
          EOF

      - name: Create AI analyzer script
        run: |
          cat <<EOF > ai_analyze.py
          from transformers import pipeline
          import sys
      
          log_file = sys.argv[1]
      
          classifier = pipeline(
              "text-classification",
              model="distilbert-base-uncased"
          )
      
          logs = open(log_file).read()[:512]
          result = classifier(logs)
      
          print("AI ANALYSIS RESULT:")
          print(result)
          EOF

      - name: Build AI image
        run: docker build -f Dockerfile.ai -t ai-analyzer .

      - name: Run AI container
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            ai-analyzer /data/test.log
